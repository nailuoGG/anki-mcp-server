name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC token for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # must match the package's Trusted Publisher environment on npmjs.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain via mise (Node 24, pnpm 11)
        uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      - name: Point npm at the official registry (OIDC publish target)
        run: npm config set registry https://registry.npmjs.org/

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1

      - name: Verify version matches tag
        run: |
          PKG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${TAG_VERSION}"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi
        id: channel

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test (stable channel gate)
        if: steps.channel.outputs.channel == 'latest'
        run: |
          pnpm run lint
          pnpm test

      - name: Publish (OIDC trusted publishing, no token)
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "beta" ]; then
            npm publish --tag beta
          else
            npm publish
          fi

      - name: Pack MCPB
        run: pnpm run mcpb

      - name: Upload MCPB to release
        run: gh release upload "${GITHUB_REF_NAME}" anki-mcp-server.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "beta" ]; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --prerelease --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
